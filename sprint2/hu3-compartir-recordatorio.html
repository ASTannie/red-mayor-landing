<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HU3 - Compartir Recordatorios</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 250px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.15);
        }
        .share {
            margin-top: 10px;
            padding: 8px 12px;
            background: #008CBA;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>HU3 - Compartir Recordatorios</h1>

    <div class="card">
        <h3>Tomar medicina - 8:00 AM</h3>
        <p>Recordatorio para el adulto mayor.</p>
        <div class="share" onclick="compartir()">Compartir</div>
    </div>

    <script>
        function compartir() {
            alert("Recordatorio compartido con familiares.");
        }
    </script>
</body>
</html>
