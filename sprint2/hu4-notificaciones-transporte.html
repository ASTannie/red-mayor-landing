<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HU4 - Notificación de Transporte</title>
    <style>
        .popup {
            display:none;
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background:white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        button { padding: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>HU4 - Notificaciones de Transporte</h1>

    <button onclick="mostrar()">Mostrar notificación</button>

    <div class="popup" id="popup">
        <h3>🚗 Ruta recomendada</h3>
        <p>Taxi: 12 min • Bus: 25 min</p>
        <button onclick="cerrar()">Cerrar</button>
    </div>

    <script>
        function mostrar() { document.getElementById("popup").style.display = "block"; }
        function cerrar() { document.getElementById("popup").style.display = "none"; }
    </script>
</body>
</html>
